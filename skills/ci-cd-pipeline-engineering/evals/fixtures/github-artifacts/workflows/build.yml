name: build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, macos, windows]
    steps:
      - uses: actions/checkout@v3
      - run: make build TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: make test
      - uses: actions/upload-artifact@v3
        with:
          name: coverage
          path: coverage/

  publish:
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - run: make publish DIR=dist
