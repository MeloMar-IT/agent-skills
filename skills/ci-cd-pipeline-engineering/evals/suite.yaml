schema: 1
selection:
  - { id: offered-github-permissions, repo: fixtures/github-gate, task: "Review the github actions workflow in workflows/release.yml for unsafe token permissions.", expect: offered }
  - { id: offered-gitlab-duplicates, repo: fixtures/gitlab-speed, task: "Explain why our gitlab ci setup starts two pipelines per merge request push.", expect: offered }
  - { id: not-offered-pager-bug, repo: fixtures/gitlab-speed, task: "Fix the off-by-one error in src/pager.py so the last page is included, and add a unit test.", expect: not-offered }
instructions:
  repeat: 4
  scenarios:
    - id: pipeline-health-report
      repo: fixtures/health-report
      task: "Write report.py (Python 3 standard library only) that produces our pipeline health report with dora metrics from runs.json and deployments.json as described in README.md. Use nearest-rank percentiles; median_queue_s covers every pipeline that started."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: 'python3 -I -c "import json,subprocess;subprocess.run([''python3'',''report.py'',''runs.json'',''deployments.json'',''report.json''],check=True);r=json.load(open(''report.json''));e={''pipeline_success_rate'':0.75,''p50_duration_s'':600,''p90_duration_s'':960,''median_queue_s'':40,''deployment_frequency_per_day'':0.4286,''change_failure_rate'':0.3333,''lead_time_median_h'':8,''recovery_time_median_h'':15};assert all(abs(r[k]-v)<=0.01*max(1,v) for k,v in e.items());assert r[''flaky_jobs'']==[''e2e'',''integration'',''test'']"'
    - id: gitlab-monorepo-speedup
      repo: fixtures/gitlab-speed
      task: "Speed up our gitlab ci monorepo pipeline in .gitlab-ci.yml: run backend_test and backend_build only when files under backend/ change and the frontend jobs only for frontend/ (the first push of a brand new branch must not run everything, so compare it against main, but the default branch must still build everything), let GitLab auto-cancel superseded pipelines, and stop each push to a branch with an open merge request from starting two pipelines. deploy_production must stay manual and default-branch only, must still work when only one side changed, must not leave the pipeline blocked waiting for the click, and two deploys to production must never run at the same time. Keep all job names and write rules inline in each job (no extends, anchors or !reference)."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: 'python3 -I -c "import re;t=open(''.gitlab-ci.yml'').read();B=lambda n:(re.search(r''(?ms)^''+n+r'':\n(.*?)(?=^\S|\Z)'',t) or [0,'' ''])[1];w=B(''workflow'');assert (''merge_request_event'' in w and re.search(r''CI_OPEN_MERGE_REQUESTS|CI_DEFAULT_BRANCH|main'',w)) or re.search(r''Workflows/(MergeRequest|Branch)-Pipelines'',t);assert all(''changes'' in B(n) and ''backend/'' in B(n) for n in [''backend_test'',''backend_build'']);assert all(''changes'' in B(n) and ''frontend/'' in B(n) for n in [''frontend_test'',''frontend_build'']);d=B(''deploy_production'');assert len(re.findall(r''optional:\s*true'',d))>=2 and ''manual'' in d and re.search(r''CI_DEFAULT_BRANCH|main'',d);assert ''interruptible: true'' in t and ''interruptible: true'' not in d;assert ''interruptible: true'' not in B(''default'') or ''interruptible: false'' in d;assert all(B(n).strip() for n in [''backend_test'',''frontend_test'',''backend_build'',''frontend_build'',''deploy_production'']);assert all(re.search(r''compare_to:\s*[\x22\x27]?(refs/heads/)?main\b'',B(n)) and re.search(r''CI_DEFAULT_BRANCH|\x22main\x22'',B(n)[:B(n).find(''changes'')]) for n in [''backend_test'',''frontend_test'',''backend_build'',''frontend_build'']);assert re.search(r''allow_failure:\s*true'',d) and re.search(r''resource_group:'',d)"'
    - id: azure-build-once-promote
      repo: fixtures/azure-promote
      task: "Our azure pipelines YAML rebuilds the image in every stage. Make it build once and promote: build and push only in the BuildImage job of the Build stage, publish the pushed image digest from that job as an output variable, and have Dev, Prod and Verify run ./deploy.sh from the repository with that exact image by digest. Dev and Prod must be deployments to the environments named dev and prod so their approval checks apply, Prod must run only after Dev and Verify only after Prod. Keep stages Build, Dev, Prod and Verify and keep BuildImage a regular job."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: 'python3 -I -c "import re;t=open(''azure-pipelines.yml'').read();S={p.split()[0]:p for p in re.split(r''(?m)^\s*-\s+stage:\s*'',t)[1:]};bp=r''docker\s+(?:buildx\s+)?build|buildAndPush|command:\s*build\b'';assert len(re.findall(bp,t))==1 and re.search(bp,S[''Build'']);assert not any(re.search(r''docker\s+(?:buildx\s+)?(?:build|push|tag)|buildAndPush|command:\s*(?:build|push|tag)'',S[k]) for k in [''Dev'',''Prod'',''Verify'']);b=S[''Build''];v=re.search(r''##vso\[task\.setvariable variable=(\w+);isOutput=true\]'',b);assert v and re.search(r''job:\s*BuildImage'',b) and ''deployment:'' not in b;names=re.findall(r''(?m)^\s*(?:-\s+)?name:\s*(\w+)'',b);f=lambda s:(lambda m:bool(m) and m.group(3) in names and m.group(4)==v.group(1) and bool(re.search(r''deploy\.sh[^\n]*\x24\(''+(m.group(1) or m.group(2))+r''\)'',s)))(re.search(r''(?:(\w+):|name:\s*(\w+)\s*\n\s*value:)\s*\x24\[\s*stageDependencies\.Build\.BuildImage\.outputs\[\x27(\w+)\.(\w+)\x27\]\s*\]'',s));assert all(f(S[k]) for k in [''Dev'',''Prod'',''Verify'']);N={''Dev'':[''Build''],''Prod'':[''Build'',''Dev''],''Verify'':[''Build'',''Prod'']};g=lambda k:(lambda d:bool(d) and all(x in d.group(1) for x in N[k]))(re.search(r''dependsOn:\s*(\[[^\]]*\]|(?:\n\s*-\s*\w+)+|\w+)'',S[k]));assert all(g(k) for k in N);assert all(re.search(r''(?m)^\s*-\s+deployment:'',S[k]) and re.search(r''-\s*checkout:\s*self'',S[k]) for k in [''Dev'',''Prod'']);assert re.search(r''environment:\s*(?:name:\s*)?[\x27\x22]?dev\b'',S[''Dev'']) and re.search(r''environment:\s*(?:name:\s*)?[\x27\x22]?prod\b'',S[''Prod''])"'
    - id: github-required-check-gate
      repo: fixtures/github-gate
      task: "Our github actions CI in workflows/ci.yml (it is .github/workflows/ci.yml in the real repository) runs the 45-minute backend job on every change. Skip the backend job when a pull request or push changes nothing under backend/. Branch protection requires only the ci-gate check, so ci-gate must report on every pull request and must fail whenever a job it needs failed or was cancelled. Also cancel superseded runs of the same pull request, and add a job named deploy that runs after ci-gate on pushes to main only, assumes a cloud role with aws-actions/configure-aws-credentials without any stored keys, and is never interrupted by a newer push and never runs in parallel with another deploy. There is no network here, so use a placeholder for anything you cannot look up."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: 'python3 -I -c "import re;t=open(''workflows/ci.yml'').read();h=t.split(''\njobs:'')[0];assert ''pull_request'' in h and not re.search(r''paths(-ignore)?:'',h);J=lambda n:(re.search(r''(?ms)^  ''+n+r'':\n(.*?)(?=^  \S|^\S|\Z)'',t) or [0,'' ''])[1];assert re.search(r''(?m)^    if:.*needs\.[\w-]+\.outputs\.'',J(''backend''));g=J(''ci-gate'');m=re.search(r''needs:\s*(\[[^\]]*\]|(?:\n\s*-\s*[\w-]+)+)'',g);assert m and ''backend'' in m.group(1) and ''frontend'' in m.group(1);assert re.search(r''always\(\)|\x21cancelled\(\)'',g);assert (''failure'' in g and ''cancelled'' in g) or (''success'' in g and ''skipped'' in g);c=re.search(r''(?ms)^concurrency:\n?(.*?)(?=^\S|\Z)'',t);assert c and re.search(r''cancel-in-progress:\s*\x24\{\{[^\n]*pull_request'',c.group(1));d=J(''deploy'');assert re.search(r''id-token:\s*write'',d) and re.search(r''contents:\s*read'',d);assert re.search(r''concurrency:'',d) and re.search(r''cancel-in-progress:\s*false'',d);assert re.search(r''(?m)^    if:.*push'',d) and ''ci-gate'' in d and ''needs'' in d;assert re.search(r''aws-actions/configure-aws-credentials@[0-9a-f]{40}\b'',d) and not re.search(r''secret-access-key|SECRET_ACCESS'',d)"'
    - id: github-artifacts-v4
      repo: fixtures/github-artifacts
      task: "Upgrade the artifact steps in our github actions workflow workflows/build.yml from upload-artifact@v3 and download-artifact@v3 to v4. The publish job must still get one merged dist/ with the output of all three matrix builds, including dist/.well-known/security.txt, and nothing from the coverage report in dist/. The coverage report must keep its hidden coverage/.coverage file."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: 'python3 -I -c "import re,fnmatch;t=open(''workflows/build.yml'').read();assert not re.search(r''(upload|download)-artifact@v[123]\b'',t);assert len(re.findall(r''upload-artifact@(v4|[0-9a-f]{40})'',t))==2 and re.search(r''download-artifact@(v4|[0-9a-f]{40})'',t);J=lambda n:(re.search(r''(?ms)^  ''+n+r'':\n(.*?)(?=^  \S|^\S|\Z)'',t) or [0,'' ''])[1];b=J(''build'');c=J(''test'');p=J(''publish'');W=r''upload-artifact@[^\n]*\n((?:.*\n){0,6})'';N=r''(?m)^\s+name:\s*(.+)$'';q=chr(34)+chr(39);u=re.search(W,b);cu=re.search(W,c);assert u and cu;n=re.search(N,u.group(1));cn=re.search(N,cu.group(1));assert n and cn and ''matrix.target'' in n.group(1);assert re.search(r''include-hidden-files:\s*true'',u.group(1)+b) and re.search(r''include-hidden-files:\s*true'',cu.group(1));pt=re.search(r''(?m)^\s+pattern:\s*(.+)$'',p);assert pt and re.search(r''merge-multiple:\s*true'',p);pat=pt.group(1).strip().strip(q);bn=n.group(1).strip().strip(q);assert all(fnmatch.fnmatch(re.sub(r''\x24\{\{\s*matrix\.target\s*\}\}'',x,bn),pat) for x in [''linux'',''macos'',''windows'']);assert not fnmatch.fnmatch(cn.group(1).strip().strip(q),pat);assert re.search(r''path:\s*dist'',p)"'
conflicts:
  - { id: against-approved, with: all }
context:
  - { id: coder-budget, max_instruction_tokens: 3000, max_description_chars: 160 }
tools:
  - { id: read-only, policy: { shell: false, network: false, filesystem: read } }
