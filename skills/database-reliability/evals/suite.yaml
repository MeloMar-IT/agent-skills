schema: 1
selection:
  - { id: online-migration-offered, repo: fixtures/pg-online-migration-runner, task: "Plan an online schema migration that adds a NOT NULL column to a large PostgreSQL table without blocking writes.", expect: offered }
  - { id: kafka-commit-not-offered, repo: fixtures/node-orders, task: "In the Node.js order service, change the Kafka consumer so it commits offsets only after the message handler has finished, and add a unit test.", expect: not-offered }
instructions:
  repeat: 4
  scenarios:
    - id: pg-online-migration-runner
      repo: fixtures/pg-online-migration-runner
      task: "Using the database-reliability skill, make this online schema migration safe for production: delete migrations/0007_orders_hardening.sql and replace it with files migrations/0007_01_<what>.sql, 0007_02_<what>.sql, ... that the runner in README.md can apply on PostgreSQL 16 while the app keeps writing, reaching the same final schema (same columns, types and defaults, index orders_public_id_key, constraint orders_customer_id_fkey, region NOT NULL). Put the public_id data backfill in backfill/orders_public_id.sql. Do not connect to any database."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 900
      check: "python3 -c 'import glob,os,re;fs=sorted(f for f in glob.glob(\"migrations/*.sql\") if os.path.basename(f)>\"0007\");R={f:open(f).read() for f in fs};N=lambda t:\" \".join(\" \".join(l.split(\"--\")[0] for l in t.lower().splitlines()).split());S={f:N(R[f]) for f in fs};A=\" \".join(S[f] for f in fs);P=lambda p:[i for i,f in enumerate(fs) if re.search(p,S[f])];assert fs and not os.path.exists(\"migrations/0007_orders_hardening.sql\");assert not re.search(\"add (column )?(if not exists )?public_id uuid[^;,]*gen_random_uuid\",A) and re.search(\"alter (column )?public_id set default gen_random_uuid\",A);assert re.search(\"add (column )?(if not exists )?status text[^;,]*default .new.\",A) and \"update orders\" not in A;X=[f for f in fs if re.search(\"create (unique )?index\",S[f])];assert X and all(\"concurrently\" in S[f] and R[f].splitlines()[0].strip()==\"-- runner: no-transaction\" and len([q for q in S[f].split(\";\") if q.strip()])==1 for f in X);assert re.search(\"create unique index concurrently [^;]*on (public[.])?orders[^;]*public_id\",A);V=\"alter table (only )?(public[.])?orders validate constraint [a-z0-9_]+\";assert all(0<=S[f].find(\"lock_timeout\")<S[f].find(\"alter table\") for f in fs if \"alter table\" in re.sub(V,\"\",S[f]));a=P(\"foreign key ?[(] ?customer_id ?[)] ?references (public[.])?customers[^;]*not valid\");v=P(\"validate constraint orders_customer_id_fkey\");assert a and v and min(v)>min(a);m=re.search(\"constraint ([a-z0-9_]+) check ?[(]+ ?region is not null ?[)]+ ?not valid\",A);assert m;c=m.group(1);ca=P(\"constraint \"+c+\" check\");cv=P(\"validate constraint \"+c);cn=P(\"alter (column )?region set not null\");assert ca and cv and cn and min(cv)>min(ca) and min(cn)>=min(cv);f=fs[min(cn)];assert min(cn)>min(cv) or S[f].find(\"validate constraint \"+c)<S[f].find(\"set not null\");B=N(open(\"backfill/orders_public_id.sql\").read());assert re.search(\"update (only )?(public[.])?orders\",B) and \"public_id is null\" in B and re.search(\"limit|between|id ?[<>]\",B);print(\"ok\")'"
    - id: pgbouncer-transaction-pool-budget
      repo: fixtures/pgbouncer-pool-budget
      task: "Using the database-reliability skill, review this connection pooling setup. Write pooling-review.json with keys breaks_in_transaction_mode (names of functions in app/db_ops.py that misbehave behind this PgBouncer configuration), worst_case_server_connections (most PostgreSQL server connections all clients in deploy/ can hold at once, rollouts included), available_connection_slots (connections PostgreSQL accepts for these application roles) and fits (true or false). You may add pooling-review.md with reasoning."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: "python3 -c 'import json;d=json.load(open(\"pooling-review.json\"));assert sorted(d[\"breaks_in_transaction_mode\"])==[\"bulk_price_lookup\",\"export_report\",\"listen_for_invalidations\",\"run_singleton_job\",\"set_tenant\"];assert d[\"worst_case_server_connections\"]==354 and d[\"available_connection_slots\"]==292 and d[\"fits\"] is False;print(\"ok\")'"
    - id: pg-default-privileges-roles
      repo: fixtures/pg-default-privileges
      task: "Using the database-reliability skill, finish sql/roles.sql so it sets up least privilege roles for the shop database exactly as README.md requires. Replace the draft, keep it a plain SQL script, and do not connect to any database."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: "python3 -c 'import re;s=\" \".join(\" \".join(l.split(\"--\")[0] for l in open(\"sql/roles.sql\").read().lower().splitlines()).split());st=[x.strip() for x in s.split(\";\") if x.strip()];H=lambda p:any(re.search(p,x) for x in st);Q=[(bool(m.group(1)),set(m.group(2).replace(\" \",\"\").split(\",\")),m.group(3),m.group(4).replace(\" \",\"\").split(\",\")) for x in st for m in [re.match(\"(alter default privileges for (?:role|user) app_owner in schema app )?grant ([a-z, ]+) on (.+?) to ([a-z_, ]+)$\",x)] if m];G=lambda d,o,v,r:any(a==d and re.fullmatch(o,b) and set(v.split())<=p and r in rs for a,p,b,rs in Q);F=\"(?:functions|routines)\";O=\"alter default privileges for (?:role|user) app_owner \";assert all(re.match(O,x) for x in st if x.startswith(\"alter default\"));assert H(\"^\"+O+\"revoke execute on \"+F+\" from [a-z_, ]*public\");assert H(\"^revoke [a-z, ]*execute[a-z, ]* on all \"+F+\" in schema app from [a-z_, ]*public\");W=\"select insert update delete\";T=\"all tables in schema app\";assert G(0,\"all \"+F+\" in schema app\",\"execute\",\"app_rw\") and G(1,F,\"execute\",\"app_rw\") and G(0,T,W,\"app_rw\") and G(0,T,\"select\",\"app_ro\") and G(1,\"tables\",W,\"app_rw\") and G(1,\"tables\",\"select\",\"app_ro\") and G(0,\"all sequences in schema app\",\"usage\",\"app_rw\") and G(1,\"sequences\",\"usage\",\"app_rw\") and G(0,\"schema app\",\"usage\",\"app_rw\") and G(0,\"schema app\",\"usage\",\"app_ro\");assert H(\"^revoke [a-z, ]*(?:create|all)[a-z, ]* on schema public from [a-z_, ]*public\");K=\"database shop from [a-z_, ]*public\";assert H(\"^revoke (?:all|[a-z, ]*temp[a-z, ]*) (?:privileges )?on \"+K);C=lambda r:G(0,\"database shop\",\"connect\",r);assert C(\"app_rw\") and C(\"app_ro\");assert not H(\"^create role app_r[wo] .*(?<!no)login\");M=lambda a,b:H(\"^create (?:user \"+b+\"|role \"+b+\" .*(?<!no)login)\") and (H(\"^grant \"+a+\" to [a-z_, ]*\"+b) or H(\"in role [a-z_, ]*\"+a));assert M(\"app_rw\",\"orders_svc\") and M(\"app_ro\",\"bi_reader\");assert not re.search(\"pg_.*_all_data|grant all|grant option|truncate|(?<!no)superuser|password\",s);print(\"ok\")'"
    - id: pitr-timeline-restore
      repo: fixtures/pitr-timeline-restore
      task: "Using the database-reliability skill, prepare the point in time recovery on restore-01 described in incident/notes.md. Choose the base backup from backups/inventory.json and write restore/plan.json with a backup_id field and a reason field; put every setting you add or override in restore/recovery-settings.conf (it is included at the end of restore/postgresql.conf, which you leave unchanged); create any signal file PostgreSQL 16 needs in restore/. The copy must stay read-only for verification and must not write into the production WAL archive. Do not run commands against any server."
      policy: { shell: true, network: false, filesystem: write }
      timeout_sec: 600
      check: "python3 -c 'import json,os,re;L=lambda p:[l.split(\"#\")[0].strip() for l in open(p).read().splitlines()];K=lambda p:dict((a.strip().lower(),b.strip().strip(chr(39)).strip()) for a,b in [l.split(\"=\",1) for l in L(p) if \"=\" in l]);E=K(\"restore/postgresql.conf\");E.update(K(\"restore/recovery-settings.conf\"));F=(\"off\",\"false\",\"0\",\"no\");assert json.load(open(\"restore/plan.json\"))[\"backup_id\"]==\"full-20261102-1300\";assert os.path.exists(\"restore/recovery.signal\") and not os.path.exists(\"restore/standby.signal\") and not os.path.exists(\"restore/recovery.conf\");r=E.get(\"restore_command\",\"\");assert \"/mnt/wal-archive/\" in r and \"%f\" in r and \"%p\" in r;assert E.get(\"recovery_target_timeline\")==\"2\";assert sum(1 for k in (\"recovery_target\",\"recovery_target_lsn\",\"recovery_target_name\",\"recovery_target_time\",\"recovery_target_xid\") if E.get(k))==1;t=E.get(\"recovery_target_time\",\"\").lower();m=re.fullmatch(\"2026-11-03[ t]([0-9]{2}):([0-9]{2}):([0-9]{2}(?:[.][0-9]+)?) ?(utc|z|[+]00(?::00)?|cet|europe/berlin|[+]01(?::00)?)\",t);assert m;q=int(m.group(1))*3600+int(m.group(2))*60+float(m.group(3))-(3600 if m.group(4) in (\"cet\",\"europe/berlin\") or m.group(4).startswith(\"+01\") else 0);assert 47220<=q<=47246.0815;assert E.get(\"recovery_target_action\",\"pause\").lower()==\"pause\";assert E.get(\"hot_standby\",\"on\").lower() not in F;assert E.get(\"archive_mode\",\"off\").lower() in F or \"/mnt/wal-archive\" not in E.get(\"archive_command\",\"\");print(\"ok\")'"
conflicts:
  - { id: against-approved, with: all }
context:
  - { id: coder-budget, max_instruction_tokens: 3000, max_description_chars: 160 }
tools:
  - { id: read-only, policy: { shell: false, network: false, filesystem: read } }
