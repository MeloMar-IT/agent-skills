apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-webhooks
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.example.com/platform/gitops.git
    targetRevision: main
    path: webhooks
  destination:
    server: https://kubernetes.default.svc
    namespace: policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
