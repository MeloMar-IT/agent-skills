apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup
  namespace: flux-system
spec:
  interval: 10m
  path: ./backup
  prune: true
  targetNamespace: db
  sourceRef:
    kind: GitRepository
    name: fleet
  postBuild:
    substitute:
      cluster_name: prod-eu1
      region: eu-west-1
