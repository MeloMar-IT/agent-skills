groups:
  - name: service-alerts
    rules:
      - record: job:http_errors:rate5m
        expr: sum(rate(http_requests_total{code=~"5.."}[5m])) by (job)
      - alert: PaymentsHigh5xx
        expr: job:http_errors:rate5m{job="payments"} > 5
        for: 5m
        labels:
          severity: critical
          team: team-payments
        annotations:
          summary: Payments error rate is high
          runbook_url: runbooks/payments-5xx.md
      - alert: NodeDiskFull
        expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.1
        for: 10m
        labels:
          severity: warning
          team: team-platform
        annotations:
          summary: Node disk is nearly full
          runbook_url: https://runbooks.example.com/runbooks/disk-full/
      - alert: CheckoutP99High
        expr: histogram_quantile(0.99, rate(checkout_latency_bucket[5m])) > 2
        for: 10m
        labels:
          severity: critical
          team: team-payments
        annotations:
          summary: Checkout p99 latency above 2s
      - alert: CheckoutP95High
        expr: histogram_quantile(0.95, rate(checkout_latency_bucket[5m])) > 1
        for: 10m
        labels:
          severity: warning
          team: team-payments
        annotations:
          summary: Checkout p95 latency above 1s
      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
          team: team-platform
        annotations:
          summary: A certificate expires within 14 days
      - alert: KafkaLagHigh
        expr: sum(kafka_consumergroup_lag) by (consumergroup) > 100000
        for: 15m
        labels:
          severity: warning
          team: team-data
        annotations:
          summary: Kafka consumer lag is high
